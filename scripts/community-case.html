<!-- Server-owned Community Forge Case. Inlined into the single game source. -->
<style>
.forge-section{font:12px system-ui;letter-spacing:0;margin:0 0 23px;color:#dae7ee}.forge-case{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding:24px;border:1px solid #48d9ce66;border-radius:17px;background:radial-gradient(ellipse at 4% 10%,#1b6b7044,transparent 60%),linear-gradient(125deg,#112831,#1b2038);box-shadow:inset 0 0 55px #04192077}.forge-case>img{width:100%;align-self:center}.forge-case small{display:block;font-size:9px;letter-spacing:1.6px;color:#72e2d5}.forge-case h2{margin:9px 0;font-size:26px;font-weight:650;color:#f0f7f8}.forge-case p{color:#9eb7c3;line-height:1.8;margin:8px 0}.forge-progress{display:flex;gap:12px;align-items:center;margin:14px 0;color:#aff2d7}.forge-progress>i{height:5px;background:#477a7b55;flex:1;max-width:230px;border-radius:5px;overflow:hidden}.forge-progress i>b{display:block;height:100%;background:linear-gradient(90deg,#41d9c5,#9973ff)}.forge-case button,.forge-owned button{font:11px system-ui;letter-spacing:0;text-transform:none;padding:9px 12px;margin:3px}.forge-primary{background:#70ddc7!important;color:#0b2829!important;border-color:#8aeee2!important}.forge-case button:disabled{opacity:.4}.forge-note{color:#a9b8c7;line-height:1.7;font-size:11px}.forge-owned{margin-top:20px}.forge-owned-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:11px}.forge-skin{border:1px solid #65859a44;border-radius:10px;overflow:hidden;background:#14222ee8}.forge-skin>img{width:100%;height:106px;object-fit:contain;background:radial-gradient(ellipse,#2b465b77,transparent)}.forge-skin>div{padding:12px}.forge-skin b{display:block;font-size:12px;color:#e5edf4;margin:5px 0}.forge-skin small{display:block;font-size:9px;color:#91b3bf;line-height:1.6}.forge-skin .forge-stat{color:#edb969}.forge-owned h3{font-size:17px;font-weight:500}.forge-error{color:#ffb7a6!important}.forge-inflight{pointer-events:none;opacity:.65}
@media(max-width:750px){.forge-case{grid-template-columns:1fr;padding:19px;gap:4px}.forge-case>img{width:210px;justify-self:center}.forge-case h2{font-size:23px}}
</style>
<script>
const FORGE_PRICE=2500,FORGE_MIN=5;
let FORGE={owner:null,epoch:0,owned:[],cases:[],ready:false,loading:null,busy:false,locked:false,uncertain:false,message:'',proofs:new Map()};
CS.communityforge={n:'Community Forge Case',cost:FORGE_PRICE,kc:0,pool:[],w:[0,0,100,0,0]};
window.szCloudEconomyLocked=()=>FORGE.locked||FORGE.uncertain;
function forgeReset(){const uid=communityAccount();if(FORGE.owner===uid)return;FORGE.owner=uid;FORGE.epoch++;FORGE.owned=[];FORGE.cases=[];FORGE.ready=false;FORGE.loading=null;FORGE.message='';FORGE.proofs.clear();}
function forgePool(){return COMMUNITY.rows.filter(r=>r.kind==='skin'&&r.case_enabled!==false);}
function forgeOwnedActive(o){return COMMUNITY.rows.some(r=>r.id===o.item_id&&r.kind==='skin');}
async function forgeLoad(){
 forgeReset();if(!sb||!SBU)return;if(FORGE.loading)return FORGE.loading;const owner=FORGE.owner,epoch=FORGE.epoch;
 const task=(async()=>{try{const [a,b]=await Promise.all([sb.from('sz_workshop_owned_skins').select('id,item_id,release_id,version,payload,stattrak,author_name,case_id,acquired_at').eq('user_id',owner).order('acquired_at',{ascending:false}).limit(2000),sb.from('sz_workshop_cases').select('id,opened_at,reward_id,purchased_at').eq('user_id',owner).order('purchased_at',{ascending:false}).limit(2100)]);if(a.error||b.error)throw a.error||b.error;if(FORGE.epoch!==epoch||communityAccount()!==owner)return;
 FORGE.owned=(a.data||[]).filter(o=>COMMUNITY_UUID.test(o.id)&&COMMUNITY_UUID.test(o.release_id));FORGE.cases=b.data||[];FORGE.ready=true;
 for(const o of FORGE.owned){o.payload=creatorParseSkin(o.payload);COMMUNITY.cache.set(o.release_id,{id:o.release_id,item_id:o.item_id,version:o.version,payload:o.payload});}
 for(const[k,ref]of Object.entries(P().communityLoadout||{}))if(!FORGE.owned.some(o=>o.id===ref.owned&&o.release_id===ref.release))delete P().communityLoadout[k];
 VISUAL_HELD.clear();drawScene();forgeMount();const opening=P().caseOpening;if(opening?.caseId==='communityforge'&&!opening.seen&&!CASE_PRESENTATION)showCasePresentation(opening,true);
 }catch(e){if(FORGE.epoch===epoch){FORGE.message=communityError(e);forgeMount();}}finally{if(FORGE.loading===task)FORGE.loading=null;}})();FORGE.loading=task;return task;
}
const FORGE_REFRESH=communityRefresh;communityRefresh=async function(){const ok=await FORGE_REFRESH();if(ok)await forgeLoad();return ok;};
const FORGE_RESET=communityReset;communityReset=function(){FORGE_RESET();forgeReset();};
function forgeError(e){const m=String(e?.message||e||'');for(const[k,v]of Object.entries({FORGE_NEEDS_FIVE:'Skrzynka odblokuje się po zatwierdzeniu 5 różnych skinów.',FORGE_FUNDS:'Potrzebujesz $2500 na zakup skrzynki.',FORGE_STALE_SAVE:'Zapis konta zmienił się. Odśwież konto i spróbuj ponownie.',FORGE_SAVE_REQUIRED:'Najpierw wczytaj i zapisz konto w chmurze.',FORGE_CASE_NOT_OWNED:'Ta skrzynka nie należy do twojego konta.',FORGE_EMPTY:'Nie ma teraz aktywnych skinów do wylosowania. Zachowujesz skrzynkę.',FORGE_CASE_LIMIT:'Najpierw otwórz część posiadanych skrzynek.'}))if(m.includes(k))return v;return 'Nie udało się potwierdzić operacji. Sprawdź połączenie i odśwież stan konta.';}
function forgeArt(w=380,h=250){const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');q.scale(w/380,h/250);q.fillStyle='#07182366';q.beginPath();q.ellipse(185,222,142,17,0,0,7);q.fill();const g=q.createLinearGradient(70,50,290,210);g.addColorStop(0,'#395a73');g.addColorStop(.5,'#172d42');g.addColorStop(1,'#324464');visualPoly(q,[[61,72],[93,44],[280,44],[319,76],[304,201],[274,220],[101,220],[65,199]],g,'#67c2c7',3);visualPoly(q,[[70,81],[108,62],[267,62],[308,83],[292,188],[266,203],[108,203],[78,185]],'#101e2b','#6490a1',1);q.strokeStyle='#3e777d';q.lineWidth=1;for(let x=94;x<300;x+=22){q.beginPath();q.moveTo(x,85);q.lineTo(x-10,185);q.stroke();}for(const x of[72,285])visualRect(q,x,98,20,65,'#151b2c','#b48eff',2);q.shadowColor='#56ead8';q.shadowBlur=15;visualPoly(q,[[190,74],[230,98],[230,145],[190,168],[150,145],[150,98]],'#183b46','#75ead8',3);q.fillStyle='#a7fff1';q.font='bold 41px system-ui';q.textAlign='center';q.fillText('F',190,139);q.shadowBlur=0;q.font='bold 10px system-ui';q.fillStyle='#9de3e5';q.fillText('COMMUNITY / FORGE',190,189);q.fillStyle='#c9b2ff';for(const x of[108,263])q.fillRect(x,47,8,9);return c.toDataURL();}
function forgeSkinArt(p,w=320,h=144){const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d'),s=Math.min((w-24)/108,(h-14)/63);q.translate(w/2-40*s,h/2);q.scale(s,s);creatorDrawPaint(q,p);return c.toDataURL();}
function forgeCard(){const count=forgePool().length,can=count>=FORGE_MIN&&!!SBU&&FORGE.ready&&!FORGE.busy&&!FORGE.uncertain,owned=FORGE.cases.filter(c=>!c.opened_at).length;return `<section class="forge-section" id="forge-shop"><div class="forge-case"><img src="${forgeArt()}" alt="Community Forge — grafitowa kapsuła z turkusowym rdzeniem"><div><small>STWORZONE PRZEZ GRACZY / ZATWIERDZONE PRZEZ WŁAŚCICIELA</small><h2>Community Forge Case</h2><p>Oryginalne projekty broni i noży. Każde otwarcie daje jeden własny przedmiot; 10% szans na wariant StatTrak™. Bez dodatkowego klucza.</p><div class="forge-progress"><b>${count} / ${FORGE_MIN} skinów</b><i><b style="width:${Math.min(100,count/FORGE_MIN*100)}%"></b></i><span>${count>=FORGE_MIN?'Odblokowana':'W przygotowaniu'}</span></div><button data-forge-buy class="forge-primary" ${can?'':'disabled'} onclick="forgeBuy()">Kup skrzynkę · $${FORGE_PRICE}</button><button onclick="forgeContents()">Zawartość i szanse</button><button onclick="communityRefresh()">Odśwież</button>${owned?`<button data-forge-open ${FORGE.busy||!count?'disabled':''} onclick="forgeOpen()">Otwórz posiadaną · ${owned}</button>`:''}<p class="forge-note">${count<FORGE_MIN?'Zakup będzie możliwy, gdy właściciel zatwierdzi co najmniej 5 różnych projektów.':`Każdy z ${count} projektów ma taką samą szansę: ${(100/count).toLocaleString('pl-PL',{maximumFractionDigits:2})}%.`}</p>${FORGE.message?`<p class="forge-error" role="status">${workshopEscape(FORGE.message)}</p>`:''}${FORGE.uncertain?'<button onclick="forgeBuy()">Sprawdź niedokończony zakup</button>':''}</div></div></section>`;}
function forgeInventory(){return `<section class="forge-section forge-owned" id="forge-owned"><h3>Skiny ze skrzynki społeczności · ${FORGE.owned.length}</h3><p class="forge-note">To przedmioty przypisane do konta, zdobyte przez otwieranie skrzynek. Sam podgląd projektu nie daje prawa do jego wyposażenia.</p><div class="forge-owned-grid">${FORGE.owned.map(o=>{const p=o.payload,active=forgeOwnedActive(o),eq=P().communityLoadout?.[p.weapon]?.owned===o.id;return `<article class="forge-skin"><img src="${forgeSkinArt(p)}" alt="${workshopEscape(p.name)}"><div><small>${workshopEscape(p.weapon==='knife'?KNIFE_MODELS[p.model]:W[p.weapon].n)}</small><b data-user-content>${workshopEscape(p.name)}</b><small>Autor: <span data-user-content>${workshopEscape(o.author_name)}</span></small>${o.stattrak?`<small class="forge-stat">StatTrak™ · ${(P().communityStat||{})[o.id]||0} zabójstw</small>`:'<small>Zwykły wariant</small>'}<button data-forge-equip="${o.id}" ${active&&!FORGE.busy?'':'disabled'} onclick="forgeEquip('${o.id}')">${!active?'Wycofany z gry':eq?'Wyposażono':'Wyposaż'}</button></div></article>`;}).join('')||'<p class="forge-note">Nie masz jeszcze skinów społeczności. Znajdziesz je w Community Forge Case.</p>'}</div></section>`;}
function forgeMount(){if(T!=='shop'&&!(T==='inv'&&INV==='w'))return;const m=$('main');if(!m)return;let slot=$('forge-area');if(!slot){slot=document.createElement('div');slot.id='forge-area';m.prepend(slot);}slot.innerHTML=forgeCard()+(T==='inv'?forgeInventory():'');}
const FORGE_TAB=tab,FORGE_INV=invTabs;
tab=function(t){const r=FORGE_TAB(t);forgeMount();return r;};invTabs=function(){const r=FORGE_INV();forgeMount();return r;};
async function forgeContents(){const pool=forgePool();await Promise.allSettled(pool.map(r=>communityRelease(r.release_id)));const o=$('pm');o.style.display='flex';o.innerHTML=`<section class="pmb cw-detail"><h2>Community Forge Case</h2><p>${pool.length} zatwierdzonych projektów. Każdy projekt ma równą szansę; w ramach niego 90% zwykły wariant i 10% StatTrak™.</p><div class="forge-owned-grid">${pool.map(r=>{const p=COMMUNITY.cache.get(r.release_id)?.payload;return p?`<article class="forge-skin"><img src="${forgeSkinArt(p)}" alt=""><div><b>${workshopEscape(r.title)}</b><small>${workshopEscape(r.author_name)} · ${(100/pool.length).toFixed(2)}%</small></div></article>`:'';}).join('')||'<p>Pula jest jeszcze pusta. Skrzynka odblokuje się przy 5 skinach.</p>'}</div><button onclick="pmClose()">Zamknij</button></section>`;}
function forgeCatalogAction(release){const o=FORGE.owned.find(o=>o.release_id===release);if(o)return forgeEquip(o.id);tab('shop');$('forge-shop')?.scrollIntoView({block:'start'});}
async function forgeEquip(id){const o=FORGE.owned.find(o=>o.id===id);if(!o)return;await communityEquip(o.release_id,o.id);forgeMount();}
function forgeRequestKey(){return 'sz-forge-purchase:'+communityAccount()+':'+DB.cur;}
async function forgeBuy(){
 if(!communityLogin()||FORGE.busy||G)return;FORGE.busy=true;FORGE.message='Potwierdzanie zakupu…';forgeMount();$('menu').inert=true;const owner=communityAccount();let request;
 try{
  if(FORGE.uncertain){await cloudLoad();if(!window.szDesktopCloudReady?.())throw Error('FORGE_SAVE_REQUIRED');FORGE.uncertain=false;}
  clearTimeout(CL.h);await Promise.allSettled([...(window.szCloudPending||[])]);if(!await window.szDesktopFlush?.())throw Error('FORGE_SAVE_REQUIRED');clearTimeout(CL.h);FORGE.locked=true;
  request=ST.getItem(forgeRequestKey())||crypto.randomUUID();ST.setItem(forgeRequestKey(),request);
  const r=await sb.rpc('sz_workshop_case_buy',{request_id:request,profile_name:DB.cur,expected_ts:DB.ts||0});if(r.error)throw r.error;if(communityAccount()!==owner)return;
  P().wallet=Number(r.data.balance);DB.ts=Number(r.data.saved_ts);ST.setItem(WORKSHOP_SAVE_KEY,JSON.stringify(DB));ST.removeItem(forgeRequestKey());FORGE.message='Kupiono Community Forge Case. Możesz ją otworzyć w ekwipunku.';
 }catch(e){FORGE.message=forgeError(e);if(!/FORGE_/.test(String(e?.message||''))){FORGE.uncertain=true;await cloudLoad();if(window.szDesktopCloudReady?.())FORGE.uncertain=false;}}
 finally{FORGE.locked=false;FORGE.busy=false;$('menu').inert=!!CASE_PRESENTATION;if(communityAccount()===owner){await forgeLoad();forgeMount();hdr();}}
}
async function forgeOpen(caseId=null){
 if(!communityLogin()||FORGE.busy||CASE_PRESENTATION||G)return;const c=FORGE.cases.find(c=>(caseId?c.id===caseId:!c.opened_at));if(!c)return;FORGE.busy=true;FORGE.message='';const epoch=FORGE.epoch;
 try{const r=await sb.rpc('sz_workshop_case_open',{case_id:c.id});if(r.error)throw r.error;if(FORGE.epoch!==epoch)return;await forgeLoad();const reward=FORGE.owned.find(o=>o.id===r.data.id);if(!reward)throw Error('FORGE_REFRESH_REQUIRED');const pool=forgePool();await Promise.allSettled(pool.map(r=>communityRelease(r.release_id)));const opening={caseId:'communityforge',item:'forge:'+reward.id,token:reward.id,at:Date.now(),seen:false};presentationCommit(p=>{p.forgeOpened=p.forgeOpened||{};if(!p.forgeOpened[c.id]){p.ac=p.ac||{};p.ac.cases=(p.ac.cases||0)+1;p.forgeOpened[c.id]=true;}p.caseOpening=opening;});showCasePresentation(opening,false);}
 catch(e){FORGE.message=forgeError(e);await forgeLoad();forgeMount();}finally{FORGE.busy=false;forgeMount();}
}
const FORGE_PRESENTATION=presentationItem,FORGE_ROLL=caseRollVisual,FORGE_IMG=caseImg;
presentationItem=function(id){if(typeof id==='string'&&(id.startsWith('forge:')||id.startsWith('ugc:'))){const owned=id.startsWith('forge:')?FORGE.owned.find(o=>o.id===id.slice(6)):null,p=owned?.payload||COMMUNITY.cache.get(id.slice(4))?.payload;if(!p||p.kind!=='sz-skin')return null;return{id,name:(owned?.stattrak?'StatTrak™ ':'')+(p.weapon==='knife'?KNIFE_MODELS[p.model]:W[p.weapon].n)+' | '+p.name,rarity:p.weapon==='knife'?4:2,st:!!owned?.stattrak,image:(w,h)=>forgeSkinArt(p,w,h)};}return FORGE_PRESENTATION(id);};
caseRollVisual=function(id){if(id==='communityforge'){const pool=forgePool().filter(r=>COMMUNITY.cache.has(r.release_id));return pool.length?'ugc:'+pool[Math.random()*pool.length|0].release_id:P().caseOpening?.item;}return FORGE_ROLL(id);};
caseImg=function(id,w,h){return id==='communityforge'?forgeArt(w,h):FORGE_IMG(id,w,h);};
async function forgeRemoteProof(id){const cached=FORGE.proofs.get(id);if(cached&&cached.until>Date.now())return cached.job;if(Date.now()-COMMUNITY_REMOTE_BUDGET.at>60000)COMMUNITY_REMOTE_BUDGET={at:Date.now(),count:0};if(COMMUNITY_REMOTE_BUDGET.count++>=40)return null;if(FORGE.proofs.size>250)FORGE.proofs.clear();const job=sb.rpc('sz_workshop_skin_proof',{instance_id:id}).then(r=>r.error?null:r.data);FORGE.proofs.set(id,{job,until:Date.now()+60000});return job;}
</script>
