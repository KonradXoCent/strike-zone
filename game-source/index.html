function lobUI(){const e=$('lob');if(!e)return;if(!L){e.innerHTML=`<button onclick=mkLobby()>Create lobby</button> <input id=jc placeholder=CODE maxlength=6 style=\"width:90px\"> <button onclick=joinLobby()>Join by code</button> <span style=\"color:#f5a524\">${esc(LM)}</span>`;return}e.innerHTML=`Code: <b>${L.code}</b> (share it) \u00b7 ${(MODES.find(x=>x[0]==(sel.mode||'classic'))||[0,''])[1]} \u00b7 ${MAPN[sel.map]}<ul>${lobPeers().map(p=>'<li>'+esc(p.n)+(p.host?' \ud83d\udc51':'')+'</li>').join('')}</ul>${lobFr()}${L.host?lobCfg()+'<button class=pri onclick=lobStart()>Start match</button> ':'Waiting for the host\u2026 '}<button onclick=lobLeave()>Leave</button>`}
async function srvInit(){if(SV.init)return;SV.init=1;SV.bots=genBots();if(!sb){SV.msg='Player servers need Supabase (see setup). Bot servers still work.';srvRender();return}SV.db=1;const ld=async()=>{const r=await sb.from('servers').select('*').gt('ts',Date.now()-45000);SV.ps=r.data||[];if(r.error)SV.msg='Server list error: '+r.error.message;srvRender()};ld();setInterval(()=>{if(T=='srv')ld();pubSrv()},10000)}
function pubSrv(){if(!SV.own||!sb||!SBU||!L||!L.host)return;const hu=Math.max(1,lobPeers().length),md=sel.mode||'classic';sb.from('servers').upsert({id:SV.own,owner:SBU.id,name:SV.name,host:P().name,mode:md,map:sel.map,code:L.code,humans:hu,bots:Math.max(0,SLOTS[md]-hu),slots:SLOTS[md],st:G?(G.over?'Match finished':md=='classic'?'Round '+Math.min(24,(G.rn||0)+1)+'/24 \u00b7 CT '+G.sc.CT+':'+G.sc.T+' T':md=='retake'?'Round '+Math.min(10,(G.rn||0)+1)+'/10':'Time left '+Math.max(0,G.t|0)+'s'):'In lobby',ts:Date.now(),ping:20}).then(()=>{})}
function delSrv(){if(SV.own&&sb)sb.from('servers').delete().eq('id',SV.own).then(()=>{});SV.own=null}
function lbPush(){if(!sb||!SBU)return;const p=P();sb.from('leaderboard').upsert({user_id:SBU.id,name:p.name,av:p.av||'\ud83d\ude0e',sr:p.sr||0,cw:p.cw||0,lvl:lvlOf(p),kills:p.kills||0,deaths:p.deaths||0,matches:p.matches||0,wins:p.wins||0,updated_at:new Date().toISOString()}).then(()=>{})}
async function lbFetch(){if(!sb)throw new Error('Supabase is not configured');const r=await sb.from('leaderboard').select('*').order('sr',{ascending:false}).limit(300);if(r.error)throw r.error;return (r.data||[]).map(x=>({...x,me:!!SBU&&x.user_id==SBU.id}))}
let FR={list:[],on:{},msg:'',init:0},FRI=null;
async function friInit(){if(!sb||!SBU||FR.init)return;FR.init=1;FR.ch=sb.channel('sz-online',{config:{presence:{key:SBU.id}}});FR.ch.on('presence',{event:'sync'},()=>{FR.on=FR.ch.presenceState();friBar();if(T=='friends')friRender();if(L)lobUI()}).subscribe(st=>{if(st=='SUBSCRIBED')FR.ch.track({n:P().name,l:L?L.code:null})});setInterval(()=>{try{FR.ch.track({n:P().name,l:L?L.code:null})}catch(e){}},5000);sb.channel('inv-'+SBU.id).on('broadcast',{event:'trade'},m=>{TRQ=m.payload;toast('Trade request from '+TRQ.from+' \u2014 open Friends');if(T=='friends')friRender()}).on('broadcast',{event:'invite'},m=>{FRI=m.payload;toast('\u2709 '+FRI.from+' invited you to a lobby \u2014 open Friends to join');if(T=='friends')friRender()}).subscribe();await friLoad()}
async function friLoad(){const r=await sb.from('friends').select('friend_id,name').eq('user_id',SBU.id);FR.list=r.data||[];friRender()}
function friTab(){friInit();friRender()}
async function friAdd(){const n=($('fn').value||'').trim().replace(/[%_]/g,'');if(!n)return;const r=await sb.from('leaderboard').select('user_id,name').ilike('name',n).limit(1);if(!r.data||!r.data.length){FR.msg='Player not found (they must be logged in and have saved progress).';friRender();return}const f=r.data[0];if(f.user_id==SBU.id){FR.msg='That is you.';friRender();return}const w=await sb.from('friends').upsert({user_id:SBU.id,friend_id:f.user_id,name:f.name});FR.msg=w.error?w.error.message:'Added '+f.name;await friLoad()}
async function friDel(id){await sb.from('friends').delete().eq('user_id',SBU.id).eq('friend_id',id);await friLoad()}
function friInvite(id){if(!L){FR.msg='Create a lobby first.';friRender();return}const ch=sb.channel('inv-'+id);ch.subscribe(st=>{if(st=='SUBSCRIBED'){ch.send({type:'broadcast',event:'invite',payload:{from:P().name,code:L.code}});setTimeout(()=>sb.removeChannel(ch),800);toast('Invite sent')}})}
async function friJoin(c){FRI=null;await mkLobby(c);tab('play')}
function lobFr(){return FR.list.filter(f=>FR.on[f.friend_id]).map(f=>`<button onclick=\"friInvite('${f.friend_id}')\">Invite ${esc(f.name)}</button>`).join(' ')+' '}
function friRender(){friBar();const m=$('main');if(!m||T!='friends')return;if(!sb||!SBU){m.innerHTML='<div class=box><h3>Friends</h3>Log in (Profile \u2192 Account) to use friends.</div>';return}m.innerHTML=`<div class=box><h3>Friends</h3>${TRQ?`<div class=box style=\"border:2px solid #f5a524\">${esc(TRQ.from)} wants to trade <button class=pri onclick=\"trAccept()\">Accept</button></div>`:''}${FRI?`<div class=box style=\"border:2px solid #f5a524\">${esc(FRI.from)} invited you to a lobby <button class=pri onclick=\"friJoin('${esc(FRI.code)}')\">Join</button></div>`:''}<input id=fn placeholder=\"nickname\" maxlength=14> <button class=pri onclick=friAdd()>Add friend</button> <small>${esc(FR.msg)}</small><table class=st><tr><th>Friend</th><th>Status</th><th></th></tr>${FR.list.map(f=>{const o=(FR.on[f.friend_id]||[])[0];return `<tr><td>${esc(f.name)}</td><td>${o?(o.l?'In lobby '+esc(o.l):'Online'):'Offline'}</td><td>${o&&L?`<button onclick=\"friInvite('${f.friend_id}')\">Invite</button>`:''} ${o&&o.l?`<button onclick=\"friJoin('${esc(o.l)}')\">Join</button>`:''} ${o?`<button onclick=\"trStart('${f.friend_id}','${esc(f.name)}')\">Trade</button>`:''} <button onclick=\"friDel('${f.friend_id}')\">Remove</button></td></tr>`}).join('')}</table></div>`}
let TR=null,TRQ=null;const OKID=/^[a-z0-9]+:\d+(:st)?$/;
function trAccept(){const q=TRQ;TRQ=null;trOpen(q.fid,q.from,false)}
function trStart(fid,fname){trOpen(fid,fname,true)}
function trOpen(fid,fname,init){if(TR)return;const room='tr-'+[SBU.id.slice(0,8),fid.slice(0,8)].sort().join('-');TR={fid,fname,room,my:null,their:null,mc:0,tc:0,exec:0,pd:0};const ch=sb.channel(room);TR.ch=ch;ch.on('broadcast',{event:'t'},m=>trRecv(m.payload)).subscribe(st=>{if(st=='SUBSCRIBED'){if(init){const inv=sb.channel('inv-'+fid);inv.subscribe(s2=>{if(s2=='SUBSCRIBED'){inv.send({type:'broadcast',event:'trade',payload:{from:P().name,fid:SBU.id}});setTimeout(()=>sb.removeChannel(inv),800)}})}trSend({k:'hi'})}});trUI()}
function trSend(o){if(TR&&TR.ch)TR.ch.send({type:'broadcast',event:'t',payload:{...o,u:SBU.id}})}
function trRecv(p){if(!TR||!p||p.u!=TR.fid)return;if(p.k=='hi'){trSend({k:'offer',id:TR.my})}else if(p.k=='offer'){TR.their=(p.id&&OKID.test(p.id)&&(W[p.id.split(':')[0]]||(p.id[0]=='v'&&bit(p.id))))?p.id:null;TR.mc=0;TR.tc=0}else if(p.k=='confirm'){TR.tc=p.on?1:0;trTry()}else if(p.k=='cancel'){toast('Trade cancelled');trClose();return}else if(p.k=='done'){TR.pd=1;trFin()}trUI()}
function trPick(id){if(!TR)return;TR.my=id;TR.mc=0;TR.tc=0;trSend({k:'offer',id});trUI()}
function trConfirm(){if(!TR||!TR.my||!TR.their)return;TR.mc=1;trSend({k:'confirm',on:1});trTry();trUI()}
function trTry(){if(!TR||!TR.mc||!TR.tc||TR.exec)return;TR.exec=1;const p=P();if(!hasItem(TR.my)){toast('You no longer own the offered skin');trSend({k:'cancel'});trClose();return}rmItem(TR.my);addItem(TR.their);save();hdr();trSend({k:'done'});trFin()}
function trFin(){if(TR&&TR.exec&&TR.pd){toast('Trade complete!');trClose()}else if(TR&&TR.exec){setTimeout(()=>{if(TR&&!TR.pd){toast('Your side is done; waiting for the partner to finish');trClose()}},8000)}}
function trCancel(){trSend({k:'cancel'});trClose()}
function trClose(){if(TR&&TR.ch)sb.removeChannel(TR.ch);TR=null;$('pm').style.display='none'}
function trUI(){if(!TR)return;const p=P(),cnt={};allItems(p).forEach(s=>cnt[s]=(cnt[s]||0)+1);const o=$('pm');o.style.display='flex';const card=id=>id?`<div class=card style=\"border-color:${RCol[itR(id)]};width:200px\"><img src=\"${itImg(id,180,64)}\" style=\"width:100%\"><b>${itName(id)}</b><small>~$${itVal(id)}</small></div>`:'<div class=card style=\"width:200px\">Nothing offered yet</div>';
o.innerHTML=`<div class=pmb><h2>TRADE WITH ${esc(TR.fname).toUpperCase()}</h2><div style=\"display:flex;gap:24px;justify-content:center;flex-wrap:wrap\"><div><b>You offer</b>${card(TR.my)}${TR.mc?'\u2705 you confirmed':''}</div><div><b>They offer</b>${card(TR.their)}${TR.tc?'\u2705 they confirmed':''}</div></div><div style=\"margin:12px 0\">Pick a skin or gloves: ${Object.keys(cnt).map(id=>`<button onclick=\"trPick('${id}')\">${itName(id)}</button>`).join(' ')||'(you have nothing to trade)'}</div><button class=pri ${TR.my&&TR.their&&!TR.mc?'':'disabled'} onclick=trConfirm()>Confirm trade</button> <button onclick=trCancel()>Cancel</button><div style=\"color:#9aa6b8;margin-top:8px;font-size:13px\">Both sides must confirm. Changing an offer resets both confirmations.</div></div>`}
sbInit();
</script>
</body></html>
