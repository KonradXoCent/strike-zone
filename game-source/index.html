function chooseCover(items, count, cs, sites) {
  const remaining=items.map((v,i)=>({v,i})), selected=[];
  while(selected.length<count && remaining.length) {
    let best=-Infinity, bi=0;
    remaining.forEach((item,i)=>{
      const [x,y]=item.v;
      const gap=selected.length?Math.min(...selected.map(o=>Math.hypot(x-o.v[0],y-o.v[1]))):18;

      if(score>best){best=score;bi=i;}
    });
    selected.push(remaining.splice(bi,1)[0]);
  }
  return selected.sort((a,b)=>a.i-b.i).map(o=>o.v);
}

</script><script>
/* Strike Zone: death camera, trade-up contracts and cosmetic upgrades.
 * Persistent inventory transactions use the normal account save.
 */
'use strict';
const WORKSHOP_SAVE_KEY='sz2';
const WORKSHOP_DURATION=3100;
let WORKSHOP_UI=null;
function workshopEscape(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function workshopState(){
  if(!WORKSHOP_UI||WORKSHOP_UI.owner!==DB.cur)WORKSHOP_UI={owner:DB.cur,tier:0,picks:[],input:null,target:null,busy:false,search:'',targetSearch:'',targetRarity:-1,targetKind:'all',factor:2,page:0,message:''};
  return WORKSHOP_UI;
}
function workshopData(){const p=P();return p.workshop||(p.workshop={history:[],last:null});}
function workshopValid(id){
  if(typeof id!=='string'||!/^([a-z0-9]+):\d+(?::st)?$/.test(id))return false;
  const [w,n]=id.split(':');return (w==='knife'?!!K[+n]:GUNS.includes(w)&&!!F[+n]);
}
let WORKSHOP_CATALOG=null;
function workshopCatalog(){
  if(!WORKSHOP_CATALOG){
    const ids=[];for(const w of GUNS)for(let i=0;i<F.length;i++)ids.push(w+':'+i);
    for(let i=0;i<K.length;i++)ids.push('knife:'+i);
    WORKSHOP_CATALOG=ids.flatMap(id=>[id,id+':st']);
  }
  return WORKSHOP_CATALOG;
}
function workshopCounts(){const counts=new Map();for(const id of P().skins)if(workshopValid(id))counts.set(id,(counts.get(id)||0)+1);return counts;}
function workshopOwned(){return [...workshopCounts().keys()].sort((a,b)=>sk(b).r-sk(a).r||skVal(a)-skVal(b)||sk(a).name.localeCompare(sk(b).name));}
function workshopName(id){return workshopEscape(sk(id).name);}
function workshopValue(id){return '$'+skVal(id).toLocaleString('pl-PL');}
function workshopChance(input,target){return workshopValid(input)&&workshopValid(target)&&skVal(target)>skVal(input)?Math.min(90,90*skVal(input)/skVal(target)):0;}
function workshopPercent(n){return n.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';}
function workshopRandom(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function workshopRandomIndex(n){
  if(!Number.isSafeInteger(n)||n<1)throw new Error('Pusta pula nagród.');
  const a=new Uint32Array(1),limit=4294967296-(4294967296%n);do{crypto.getRandomValues(a);}while(a[0]>=limit);return a[0]%n;
}
function workshopEquipped(id){const p=P();return Object.values(p.eq||{}).includes(id)||Object.values(p.eq2||{}).includes(id);}
function workshopCleanLoadout(p){
  const owned=new Set(p.skins);
  for(const [k,id]of Object.entries(p.eq||{}))if(id&&workshopValid(id)&&!owned.has(id))p.eq[k]=null;
  for(const k of ['knife_CT','knife_T'])if(p.eq2?.[k]&&!owned.has(p.eq2[k]))p.eq2[k]=null;

function workshopCommit(consumed,reward,transaction){
  const p=P(),next=p.skins.slice();

  if(reward){if(!workshopValid(reward))throw new Error('Nieprawidłowa nagroda.');next.push(reward);}

  catch(e){p.skins=before.skins;p.eq=before.eq;p.eq2=before.eq2;p.workshop=before.workshop;DB.ts=before.ts;throw new Error('Nie udało się zapisać wyniku. Ekwipunek pozostał bez zmian.');}
  try{cloudPush();}catch(e){}
  return transaction;
}
function workshopTransaction(kind,consumed,reward,extra={}){
  return {id:crypto.randomUUID(),kind,consumed:[...consumed],reward,success:!!reward,at:Date.now(),ack:false,...extra};
}
function workshopResult(kind){const t=workshopData().last;return t&&!t.ack&&t.kind===kind?t:null;}
function workshopAnimate(transaction){
  const s=workshopState();s.busy=true;s.message='';const owner=s.owner;
  setTimeout(()=>{
    if(WORKSHOP_UI!==s||DB.cur!==owner)return;s.busy=false;
    if(T==='inv'&&(INV==='contracts'||INV==='upgrader')){workshopRender();if((transaction.kind==='contract'&&INV==='contracts')||(transaction.kind==='upgrade'&&INV==='upgrader'))workshopBurst(transaction.success);}
    hdr();
  },WORKSHOP_DURATION);
}
function workshopAcknowledge(){
  const s=workshopState();if(s.busy)return;const d=workshopData();if(d.last)d.last.ack=true;s.picks=[];s.target=null;s.message='';if(s.input&&!P().skins.includes(s.input))s.input=null;save();workshopRender();
}
function workshopError(message){workshopState().message=message;workshopRender();}
function workshopTabs(){return `<div class="w-tabs" aria-label="Kategorie ekwipunku">${[['w','Skórki i wyposażenie'],['contracts','Kontrakty'],['upgrader','Upgrader'],['br','Battle Royale'],['mu','Muzyka']].map(([key,label])=>`<button class="${INV===key?'active':''}" onclick="invSet('${key}')">${label}</button>`).join('')}</div>`;}
const WORKSHOP_INV_TABS=invTabs;
invTabs=function(){
  if(INV==='contracts'||INV==='upgrader'){workshopRender();return;}
  WORKSHOP_INV_TABS();const bar=$('main').firstElementChild;if(bar)bar.outerHTML=workshopTabs();
};
function workshopOpen(kind){INV=kind;tab('inv');$('main').scrollTop=0;}
function workshopHeading(label,description){return `<header class="w-heading"><div><span class="w-kicker">EKWIPUNEK / WARSZTAT</span><h1>${label}</h1><p>${description}</p></div></header>`;}
function workshopNotice(){const m=workshopState().message;return m?`<div class="w-notice" role="status">${workshopEscape(m)}</div>`:'';}
function workshopItemCard(id,options={}){
  const s=sk(id),count=options.count,picked=options.picked||0;
  return `<button class="w-item ${options.selected?'selected':''}" style="--rarity:${RCol[s.r]}" data-skin="${id}" ${options.disabled?'disabled':''} onclick="${options.action||'contractAdd'}(this.dataset.skin)" title="${workshopName(id)}"><span class="w-item-top">${s.st?'<em>ST</em>':'<em></em>'}${count!=null?`<span>${picked?picked+' / '+count:'×'+count}</span>`:''}</span><img src="${skinImg(id,180,72)}" alt="${workshopName(id)}" loading="lazy"><span class="w-item-type">${workshopEscape(s.w==='knife'?KNIFE_MODELS[s.model||'classic']:W[s.w].n)}</span><b>${workshopEscape(s.n)}</b><small>${workshopValue(id)}${workshopEquipped(id)?' · wyposażony':''}</small></button>`;
}
function contractTier(r){const s=workshopState();if(s.busy)return;s.tier=+r;s.picks=[];s.message='';workshopRender();}
function contractAdd(id){
  const s=workshopState();if(s.busy||workshopResult('contract')||!workshopValid(id))return;
  if(sk(id).r!==s.tier||s.tier>3)return;
  if(s.picks.length>=10)return workshopError('Kontrakt ma już 10 skinów. Usuń jeden, aby zmienić wybór.');
  const selected=s.picks.filter(x=>x===id).length,owned=workshopCounts().get(id)||0;
  if(selected>=owned)return workshopError('Wszystkie posiadane egzemplarze tego skina są już wybrane.');
  s.picks.push(id);s.message='';workshopRender();
}
function contractRemove(i){const s=workshopState();if(s.busy||workshopResult('contract'))return;s.picks.splice(i,1);s.message='';workshopRender();}
function contractFill(){
  const s=workshopState();if(s.busy||workshopResult('contract'))return;
  const counts=workshopCounts();for(const id of workshopOwned().filter(id=>sk(id).r===s.tier).sort((a,b)=>skVal(a)-skVal(b))){
    let available=counts.get(id)-s.picks.filter(x=>x===id).length;while(available-->0&&s.picks.length<10)s.picks.push(id);if(s.picks.length===10)break;
  }
  s.message=s.picks.length===10?'':'Brakuje skinów tej jakości. Zdobądź kolejne skiny w skrzynkach lub na rynku.';workshopRender();
}
function contractPool(tier,st){return workshopCatalog().filter(id=>sk(id).r===tier+1&&sk(id).st===st);}
function contractExecute(){
  const s=workshopState();if(s.busy||workshopResult('contract'))return;
  if(s.picks.length!==10||s.picks.some(id=>!workshopValid(id)||sk(id).r!==s.tier)||s.tier>3)return workshopError('Wybierz dokładnie 10 skinów tej samej jakości.');
  const allST=s.picks.every(id=>sk(id).st),pool=contractPool(s.tier,allST);
  try{
    const reward=pool[workshopRandomIndex(pool.length)],t=workshopTransaction('contract',s.picks,reward,{tier:s.tier});workshopCommit(s.picks,reward,t);workshopAnimate(t);workshopRender();hdr();
  }catch(e){workshopError(e.message);}
}
function contractRender(){
  const s=workshopState(),counts=workshopCounts(),result=workshopResult('contract'),locked=s.busy||!!result,picks=result?result.consumed:s.picks;
  if(result)s.tier=result.tier;
  const owned=[...counts.keys()].filter(id=>sk(id).r===s.tier).sort((a,b)=>skVal(a)-skVal(b)||sk(a).name.localeCompare(sk(b).name)),pool=contractPool(s.tier,picks.length===10&&picks.every(id=>sk(id).st));
  return workshopHeading('Kontrakty','Wybierz 10 skinów tej samej jakości. Otrzymasz jeden losowy skin o poziom wyżej.')+`
  <div class="w-tier-tabs">${RC.map((label,r)=>`<button style="--rarity:${RCol[r]}" class="${s.tier===r?'active':''}" onclick="contractTier(${r})" ${r===4||locked?'disabled':''}>${workshopEscape(label)}${r===4?' · max':''}</button>`).join('')}</div>
  ${workshopNotice()}
  <section class="w-contract-machine ${s.busy?'running':''}">
    <div class="w-machine-top"><span>KONTRAKT WYMIANY</span><b>${picks.length}<small> / 10</small></b></div>
    <div class="w-slots">${Array.from({length:10},(_,i)=>{const id=picks[i];return `<button class="w-slot ${id?'filled':''}" style="--rarity:${id?RCol[sk(id).r]:'#394151'}" onclick="contractRemove(${i})" ${locked||!id?'disabled':''} aria-label="${id?'Usuń '+workshopName(id):'Puste miejsce '+(i+1)}">${id?`<img src="${skinImg(id,160,70)}" alt="${workshopName(id)}"><span>${workshopEscape(sk(id).n)}</span><i>×</i>`:`<b>+</b><span>${String(i+1).padStart(2,'0')}</span>`}</button>`;}).join('')}</div>
    <div class="w-contract-bottom"><div class="w-contract-next"><span class="w-tier-dot" style="background:${RCol[s.tier]}"></span>${RC[s.tier]}<b>→</b><span class="w-tier-dot" style="background:${RCol[s.tier+1]}"></span><strong style="color:${RCol[s.tier+1]}">${RC[s.tier+1]}</strong></div><button class="w-primary" onclick="contractExecute()" ${locked||picks.length!==10?'disabled':''}>${s.busy?'Wymiana…':'Wymień 10 → 1'}</button></div>
    <p class="w-rule">10 wybranych egzemplarzy zostanie zużytych. Każdy z ${pool.length} skinów następnej jakości ma taką samą szansę. 10 skinów StatTrak™ daje nagrodę StatTrak™; mieszany kontrakt daje zwykły skin.</p>
  </section>
  ${result?workshopResultHTML(result):''}
  <section class="w-library ${s.busy?'w-locked':''}"><div class="w-section-title"><div><h2>Twoje skiny · ${RC[s.tier]}</h2><span>${owned.reduce((n,id)=>n+counts.get(id),0)} egzemplarzy · kliknij, aby dodać</span></div><button onclick="contractFill()" ${locked?'disabled':''}>Dobierz do 10</button></div><div class="w-item-grid">${owned.map(id=>workshopItemCard(id,{count:counts.get(id),picked:picks.filter(x=>x===id).length,selected:picks.includes(id),disabled:locked||picks.filter(x=>x===id).length>=counts.get(id)})).join('')||'<p class="w-empty">Brak skinów tej jakości. Otwórz skrzynki lub odwiedź rynek.</p>'}</div></section>`;
}
function upgradeInput(id){
  const s=workshopState();if(s.busy||workshopResult('upgrade')||!workshopValid(id)||!P().skins.includes(id))return;

function upgradeTarget(id){const s=workshopState();if(s.busy||workshopResult('upgrade')||!workshopCatalog().includes(id)||!workshopChance(s.input,id))return;s.target=id;s.message='';workshopRender();}
function upgradeFilter(key,value){const s=workshopState();if(s.busy)return;s[key]=value;s.page=0;workshopRender();}
function upgradeSearch(key,element){

trRecv=function(data){if(!TR||!data||typeof data!=='object'||data.u!==TR.fid)return;if(TR.exec&&data.k!=='done')return;
 if(data.k==='hi')trSend({k:'offer',id:TR.my});
 else if(data.k==='offer'){TR.their=tradeItemValid(data.id)?data.id:null;TR.mc=TR.tc=0;}
 else if(data.k==='confirm'){if(data.pair&&data.pair!==tradePairKey())return;if(!TR.my||!TR.their)return;TR.tc=data.on===1?1:0;trTry();}
 else if(data.k==='cancel'){toast('Wymiana anulowana');trClose();return;}
 else if(data.k==='done'){TR.pd=1;trFin();}trUI();
};

 try{presentationCommit(p=>{const outgoing=TR.my,incoming=TR.their;if(!rmItem(outgoing))throw new Error('item');addItem(incoming);workshopCleanLoadout(p);if(outgoing.endsWith(':st')&&!p.skins.includes(outgoing)&&p.stk)delete p.stk[outgoing];if(incoming.endsWith(':st')){p.stk=p.stk||{};p.stk[incoming]=p.stk[incoming]||0;}p.tradeHistory=[{at:Date.now(),give:outgoing,receive:incoming},...(p.tradeHistory||[])].slice(0,12);});}
 catch(e){toast(e.message);trSend({k:'cancel'});trClose();return;}transaction.exec=1;hdr();trSend({k:'done'});trFin();

const FIX_NETWORK_START=start;start=function(){if(L&&!L.host){netSend({t:'join'});toast('Mecz uruchamia host lobby.');return;}return FIX_NETWORK_START();};

const FIX_NETWORK_HEAL=brStartHeal;brStartHeal=function(p){if(G?.client&&p===G.me){netSend({t:'heal'});return;}return FIX_NETWORK_HEAL(p);};

const FIX_NETWORK_WALL=buildWall,FIX_NETWORK_UNWALL=delWall;
buildWall=function(p){if(G?.client&&p===G.me){netSend({t:'wall'});return;}return FIX_NETWORK_WALL(p);};
delWall=function(p){if(G?.client&&p===G.me){netSend({t:'unwall'});return;}return FIX_NETWORK_UNWALL(p);};
$('br-map-canvas').addEventListener('click',()=>{if(G?.client&&G.me.ap&&G.brWaypoint)netSend({t:'landing',x:G.brWaypoint.x,y:G.brWaypoint.y});});

const FIX_NETWORK_MINE=placeMine;placeMine=function(p){if(G?.client&&p===G.me){netSend({t:'mine'});return;}return FIX_NETWORK_MINE(p);};
