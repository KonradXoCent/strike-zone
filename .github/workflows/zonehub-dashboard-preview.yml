name: Zone Hub Ultimate Team checks
on:
  push:
    branches: [feature/zonehub-purple-dashboard, feature/zonehub-tile-catalog-football, feature/stadiums-zombie-chat, feature/football-ultimate-club]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ensure-generated.cjs
      - name: Check frontend syntax and UI translations
        run: |
          node --check platform/ui/app.js
          node --check platform/ui/common.js
          npm run check:ui
      - name: Test library, catalog and update compatibility
        run: node --test --test-concurrency=2 tests/zone-hub*.test.cjs tests/zone-football*.test.cjs
      - name: Test actual Zone Hub desktop UI, navigation, accounts and games
        run: node scripts/zone-hub-smoke.cjs
      - name: Verify standalone football rules, bots and two-client match
        run: |
          node scripts/football-preview-smoke.cjs
          node scripts/football-preview-network.cjs
          node scripts/football-ultimate-smoke.cjs
      - name: Verify Zombie modes, map paths and actual two-client co-op
        run: |
          node --test tests/zone-zombie.test.cjs
          node scripts/zombie-preview-smoke.cjs
          node scripts/zombie-preview-network.cjs
          node scripts/strike-separation-smoke.cjs
      - name: Prepare managed-game installation fixtures
        run: node scripts/prepare-game.cjs
      - name: Build the updated dashboard installer and game fixtures
        run: node scripts/build-platform.cjs
      - name: Download the current public Zone Hub for an actual upgrade test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download zonehub-v0.1.13 --repo KonradXoCent/strike-zone --pattern ZoneHub-Beta-0.1.13.exe --dir previous-platform
      - name: Verify the installed update preserves login, settings and games
        run: node scripts/zone-hub-windows-update-smoke.cjs --from=0.1.13
      - name: Keep the preview installer private to the workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zone-Hub-0.1.19-Preview-Installer
          path: |
            dist-platform/ZoneHub-Beta-*.exe
            dist-platform/*.blockmap
            dist-platform/zonehub.yml
            dist-platform/installed-update-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect dashboard review screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Zone-Hub-0.1.19-Screenshots
          path: |
            test-output/zonehub/*.png
            test-output/football/*.png
            test-output/zombie/*.png
            test-output/separation/*.png
          if-no-files-found: ignore
          retention-days: 30
