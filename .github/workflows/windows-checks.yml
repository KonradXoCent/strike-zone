name: Windows feature checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild the embedded game and platform item atlas
        run: node scripts/ensure-generated.cjs
      - name: Persist generated assets on this feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/rotation-zonehub' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-source/index.html shared/locale-data.js platform/ui/items.js platform/ui/items.css platform/ui/items.webp
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Build embedded game and Zone Hub item atlas"
            git push origin HEAD:feature/rotation-zonehub
          }

      - run: npm test
      - run: npm run check:ui
      - name: Test Zone Hub accounts, profiles, public inventories, trades and launcher handoff
        run: npm run prepare:game && npm run test:platform-ui
      - name: Test Zombie grenades, football safety, original Halloween music and bonus-code recovery
        run: npm run test:seasonal
      - name: Test Halloween progression, event cases, exclusive items, rendering and expiry
        run: npm run test:halloween
      - name: Audit Polish and English interface screens
        run: npm run test:locale
      - name: Test minigames votes, physics, bots and arcade rotation
        run: npm run test:minigames
      - name: Test minigame and Zombie HUDs, football statistics, replay and responsive scoreboards
        run: npm run test:arcade-ui
      - name: Test agent cases, ownership, team appearance and bounded content dialogs
        run: npm run test:agents
      - name: Test expanded glove case, appearance, ownership and drop pool
        run: npm run test:gloves
      - name: Test compact prices and exact transactions
        run: npm run test:money
      - name: Test colored match HUD, observer roles, cameras and passive progression
        run: npm run test:spectator
      - run: npm run test:network
      - run: npm run test:launcher
      - run: npm run test:friends
      - name: Test friendship consent across launcher and game, fullscreen and safe startup
        run: npm run test:launcher-social
      - name: Test football and Prop Hunt HUD in both languages and responsive sizes
        run: npm run test:modes-hud
      - name: Test team loadouts, cautious knife travel and the buy/refund menu
        run: npm run test:loadout
      - run: npm run test:hub
      - run: npm run test:controls
      - name: Test Hide and Seek arenas, fair bots, rounds and rewards
        run: npm run test:hide-seek
      - name: Test Prop Hunt forms, fair observations, shots and matches
        run: npm run test:prop-hunt
      - run: npm run test:materials
      - run: npm run test:workshop-maps
      - name: Test Workshop pool overrides, version replacement and case membership
        run: npm run test:moderation
      - name: Test Workshop submissions, shared lobbies and skin ownership
        run: npm run test:community
      - run: npm run test:social
      - run: npm run test:gameplay
      - name: Test standalone sign-in and cloud persistence of owned team loadouts
        run: npm run test:preview
      - name: Build standalone HTML test preview
        run: node scripts/prepare-preview.cjs test-preview/Strike-Zone-Test.html
      - name: Upload standalone HTML test preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Strike-Zone-HTML-Test
          path: test-preview/Strike-Zone-Test.html
          if-no-files-found: error
          retention-days: 90
      - name: Build isolated Windows launcher preview
        run: npm run prepare:game && node scripts/build.cjs --test --test-revision=5
      - name: Upload Windows launcher preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Strike-Zone-Launcher-Test
          path: dist-test/StrikeZone-Test-*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Build Zone Hub Windows beta
        run: npm run dist:platform
      - name: Upload Zone Hub Windows beta
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Zone-Hub-Beta
          path: dist-platform/ZoneHub-Beta-*.exe
          if-no-files-found: error
          retention-days: 90
