name: Build, publish and test Windows update
on:
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'main.cjs'
      - '*preload.cjs'
      - 'core/**'
      - 'launcher/**'
      - 'shared/**'
      - 'assets/**'
      - 'game-source/**'
      - 'game/*.js'
      - 'scripts/**'
      - 'tests/**'
      - 'updates.json'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure mandatory GitHub updates
        shell: pwsh
        run: node scripts/configure-updates.cjs --github "$env:GITHUB_REPOSITORY"
      - run: npm test
      - run: npm run check:ui
      - name: Test Zombie grenades, football safety, original Halloween music and bonus-code recovery
        run: npm run test:seasonal
      - name: Test Halloween progression, event cases, exclusive items, rendering and expiry
        run: npm run test:halloween
      - name: Test minigames votes, physics, bots and arcade rotation
        run: npm run test:minigames
      - name: Test arcade and Zombie HUDs, football scoreboards and goal replays
        run: npm run test:arcade-ui
      - name: Test agent cases, team cosmetics and bounded contents
        run: npm run test:agents
      - name: Test expanded glove case and saved equipment
        run: npm run test:gloves
      - name: Test compact prices and exact transactions
        run: npm run test:money
      - name: Test mode-specific map editors and custom maps
        run: npm run test:creator-modes
      - name: Test Domination, Heist and Wave Survival on nine arenas
        run: npm run test:objectives
      - name: Test compact mode scoreboards, killfeed and match team locks
        run: npm run test:match-presentation
      - name: Test spectator teams and passive progression
        run: npm run test:spectator
      - name: Test football and Prop Hunt HUD layouts
        run: npm run test:modes-hud
      - name: Test team loadouts and buy/refund menu
        run: npm run test:loadout
      - name: Test launcher accounts and friends on Windows before publishing
        run: npm run test:launcher
      - name: Test in-game avatars, presence and online-only trade invitations
        run: npm run test:friends
      - name: Test mutual invitations, launcher startup and fullscreen
        run: npm run test:launcher-social
      - name: Test inventory filters, pass, lobby and game selectors
        run: npm run test:hub
      - name: Test community map bots, counters, likes and promotion
        run: npm run test:workshop-maps
      - name: Test Workshop pool overrides, version replacement and case membership
        run: npm run test:moderation
      - name: Test Workshop submissions, shared lobbies and skin ownership
        run: npm run test:community
      - name: Audit Polish and English interface screens
        run: npm run test:locale
      - name: Test editor zoom, painting and gameplay pointer lock
        run: npm run test:controls
      - name: Test Hide and Seek arenas, fair bots, rounds and rewards
        run: npm run test:hide-seek
      - name: Test Prop Hunt forms, fair observations, shots and matches
        run: npm run test:prop-hunt
      - name: Test cached map materials, geometry and render cost
        run: npm run test:materials
      - name: Test shared languages, themes and persistent chat
        run: npm run test:social
      - name: Test two SDK clients through lobby and running server list
        run: npm run test:network
      - name: Test gameplay and standalone account persistence
        run: npm run test:gameplay && npm run test:preview
      - name: Build current Windows installer
        if: ${{ !startsWith(github.event.head_commit.message, 'test:') }}
        run: npm run dist:win
      - name: Stage current release artifacts
        if: ${{ !startsWith(github.event.head_commit.message, 'test:') }}
        shell: pwsh
        run: |
          New-Item release -ItemType Directory -Force | Out-Null
          Copy-Item dist/*.exe, dist/*.blockmap, dist/latest.yml release/
      - name: Publish release
        if: ${{ !startsWith(github.event.head_commit.message, 'test:') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.cjs
      - name: Download previous public 1.5.4 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release download v1.5.4 --repo "$env:GITHUB_REPOSITORY" --pattern "StrikeZone-Setup-1.5.4.exe" --dir release
      - name: Test installed 1.5.4 update, launcher accounts and Escape on Windows
        run: node scripts/windows-update-smoke.cjs
      - name: Attach Windows update test report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (Test-Path release/update-smoke-report.json) {
            $version = node -p "require('./package.json').version"
            gh release upload "v$version" release/update-smoke-report.json --repo "$env:GITHUB_REPOSITORY" --clobber
          }
